server {
    listen 80;
    server_name api.crm.local; # Replace with your production domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.crm.local; # Replace with your production domain

    ssl_certificate /etc/letsencrypt/live/api.crm.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.crm.local/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Increase allowed payload size
    client_max_body_size 50M;

    location / {
        proxy_pass http://host.docker.internal:3000; # Points to API Gateway
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addres_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
